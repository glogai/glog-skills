name: Glog Scan
on:
  workflow_dispatch:

jobs:
  glog-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Checkout glog-action repository
        uses: actions/checkout@v6
        with:
          repository: glogai/glog-action
          token: ${{ secrets.PAT_TOKEN }}
          path: .github/glog-action
          ref: main

      - name: Run Glog.AI
        uses: ./.github/glog-action
        with:
          client: 'glog'
          github-token: ${{ secrets.PAT_TOKEN }}
          glog-token: ${{ secrets.GLOG_TOKEN }}
          upload: 'false'
          on-prem-upload: 'true'
          issue: 'false'
          autofix: 'false'
          sarif-format-type: 'STANDARD'
          sbom: 'true'
          vex: 'true'
          cbom: 'true'
          supply-chain: 'true'
          rebuild: 'true'
          rebuild-max-packages: '25'
          scl-uuid: '6c163eaf-96c6-479b-9ce2-ba87367c069a'
